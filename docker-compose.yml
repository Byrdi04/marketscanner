services:
  # --- Python API Backend ---
  backend:
    container_name: market-scanner-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      #- /opt/appdata/market-scanner/bets.db:/app/bets.db
      - /opt/appdata/market-scanner:/app/data
    env_file:
      - /opt/appdata/market-scanner/.env
    environment:
      - TZ=Europe/Copenhagen
    networks:
      - market-net

  # --- Next.js UI Frontend ---
  frontend:
    container_name: market-scanner-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BACKEND_URL=http://market-scanner-backend:8000
    restart: unless-stopped
    environment:
      - TZ=Europe/Copenhagen
      - BACKEND_URL=http://market-scanner-backend:8000
    networks:
      - market-net
      - proxy-net

networks:
  market-net:
    driver: bridge
  proxy-net:
    external: true
