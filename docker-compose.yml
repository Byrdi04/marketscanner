services:
  # --- Python API Backend ---
  backend:
    container_name: market-scanner-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      #- /opt/appdata/market-scanner/bets.db:/app/bets.db
      - /opt/appdata/market-scanner:/app/data
    env_file:
      - /opt/appdata/market-scanner/.env
    environment:
      - TZ=Europe/Copenhagen
    networks:
      - market-net

  # --- Next.js UI Frontend ---
  frontend:
    container_name: market-scanner-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BACKEND_URL=http://market-scanner-backend:8000
    restart: unless-stopped
    environment:
      - TZ=Europe/Copenhagen
      - BACKEND_URL=http://market-scanner-backend:8000
    networks:
      - market-net
      - proxy-net

  # --- Self-hosted NCAA Scores API (settlement source; ADR-0003) ---
  # henrygd/ncaa-api mirrors ncaa.com's internal feed. Backend reaches it by
  # service DNS on market-net. Published to the loopback only, so it is never
  # publicly reachable and does NOT join proxy-net.
  ncaa-api:
    image: 'henrygd/ncaa-api'
    container_name: ncaa-api
    restart: unless-stopped
    networks:
      - market-net
    ports:
      - '127.0.0.1:3000:3000'

networks:
  market-net:
    driver: bridge
  proxy-net:
    external: true
